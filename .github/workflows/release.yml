name: Build and Release Desktop App

on:
  push:
    tags:
      - 'v*' # Trigger on all version tags (e.g., v1.2.21)

jobs:
  validate-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify release version and tag
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: node scripts/validate-release.cjs
      - name: Require compatible public backend
        run: node scripts/validate-backend.cjs

  release:
    needs: validate-release
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm ci

      - name: Integration regression tests
        run: npm test

      - name: Build and Publish (Windows)
        if: matrix.os == 'windows-latest'
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
          VITE_API_BASE: https://api.emptrakr.com/api
          VITE_WEB_BASE: https://emptrakr.com
          API_BASE: https://api.emptrakr.com/api
          WEB_BASE: https://emptrakr.com
        run: |
          node scripts/write-electron-config.cjs
          npm run build
          npx electron-builder --win -p always --config.forceCodeSigning=false --config.win.signExecutable=false

