name: Build and Release Desktop App

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: desktop-stable-release
  cancel-in-progress: false

env:
  API_BASE: https://api.emptrakr.com/api
  VITE_API_BASE: https://api.emptrakr.com/api
  WEB_BASE: https://emptrakr.com
  VITE_WEB_BASE: https://emptrakr.com

jobs:
  validate-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Require signing and publishing credentials
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          WIN_PUBLISHER_SUBJECT: ${{ vars.WIN_PUBLISHER_SUBJECT }}
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: node scripts/validate-release-credentials.cjs
      - name: Verify release version and tag
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: node scripts/validate-release.cjs
      - name: Require compatible public backend
        run: node scripts/validate-backend.cjs

  release:
    needs: validate-release
    name: Sign and verify ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: macos-15-intel
            platform: mac
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Regression tests
        run: npm test
      - name: Lint
        run: npm run lint
      - name: Build signed Windows installer without publishing
        if: matrix.platform == 'windows'
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: npm run electron:build:signed
      - name: Verify Windows installer and packaged executable
        if: matrix.platform == 'windows'
        env:
          WIN_PUBLISHER_SUBJECT: ${{ vars.WIN_PUBLISHER_SUBJECT }}
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          node tools/verify-release-artifacts.cjs --dir release --platform windows --version $version --publisher $env:WIN_PUBLISHER_SUBJECT --app release/win-unpacked/EmpTrakr.exe --source-sha $env:GITHUB_SHA --report release/windows-verification.json
      - name: Build and notarize Intel and Apple Silicon installers without publishing
        if: matrix.platform == 'mac'
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm run electron:build:mac:signed
      - name: Verify signatures and notarization inside every final Mac archive
        if: matrix.platform == 'mac'
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        shell: bash
        run: |
          version=$(node -p 'require("./package.json").version')
          node tools/verify-release-artifacts.cjs --dir release --platform mac --version "$version" --team-id "$APPLE_TEAM_ID" --source-sha "$GITHUB_SHA" --report release/mac-verification.json
      - name: Preserve verified release assets
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-release
          if-no-files-found: error
          retention-days: 14
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.blockmap
            release/latest*.yml
            release/*-verification.json

  publish:
    needs: [validate-release, release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install verification dependencies
        run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          pattern: '*-release'
          path: release
          merge-multiple: true
      - name: Stage, verify downloads, and publish the complete release
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: npm run electron:publish

